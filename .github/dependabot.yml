version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # All patch updates in one pull request, minor and major updates one by one.
    # Security updates are not affected, they still get their own pull request right away
    groups:
      maven-patch:
        update-types:
          - "patch"

  # Action versions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
