<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img" aria-labelledby="title description">
  <title id="title">PDFCreator to html2pdf: accessibility table-header fix</title>
  <desc id="description">Runtime export flow and Maven build-time source patch for OpenHTMLtoPDF, including diagnostic cache paths and a separate page-break note.</desc>
  <defs>
    <marker id="arrow-runtime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#147d73"/>
    </marker>
    <marker id="arrow-build" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b66a1d"/>
    </marker>
    <marker id="arrow-link" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#547086"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2b35; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #53636e; }
      .lane-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #465863; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #31424c; }
      .muted { fill: #667780; }
      .runtime-card { fill: #ffffff; stroke: #87c8bd; stroke-width: 1.5; }
      .build-card { fill: #ffffff; stroke: #e2b783; stroke-width: 1.5; }
      .soft-runtime { fill: #eaf6f3; }
      .soft-build { fill: #fbf2e7; }
    </style>
  </defs>

  <rect width="1480" height="980" fill="#f4f7f8"/>
  <rect x="0" y="0" width="1480" height="112" fill="#ffffff"/>
  <path d="M0 111.5 H1480" stroke="#d7e0e4"/>
  <text x="56" y="54" class="title">PDFCreator to html2pdf</text>
  <text x="58" y="82" class="subtitle">Runtime export path, Maven source overlay, and the cache locations involved in the table-header fix</text>

  <rect x="48" y="132" width="1384" height="314" rx="8" fill="#edf6f4" stroke="#d2e8e3"/>
  <text x="70" y="164" class="lane-title" fill="#126d65">RUNTIME EXPORT</text>

  <g>
    <rect x="68" y="187" width="292" height="220" rx="7" class="runtime-card"/>
    <rect x="68" y="187" width="292" height="8" rx="4" fill="#147d73"/>
    <text x="88" y="226" class="card-title">1. PDFCreator</text>
    <text x="88" y="256" class="body">TableProcessor runs:</text>
    <text x="100" y="281" class="small">TableWidthUpdater</text>
    <text x="100" y="303" class="small">TableHeadsDuplicator</text>
    <text x="88" y="338" class="small">Eligible first header row moves</text>
    <text x="88" y="358" class="small">from &lt;tbody&gt; into &lt;thead&gt;</text>
    <text x="88" y="384" class="small muted">Repeated table headers remain enabled</text>
  </g>

  <path d="M365 296 H392" stroke="#147d73" stroke-width="2.5" marker-end="url(#arrow-runtime)"/>

  <g>
    <rect x="402" y="187" width="318" height="220" rx="7" class="runtime-card"/>
    <rect x="402" y="187" width="318" height="8" rx="4" fill="#147d73"/>
    <text x="422" y="226" class="card-title">2. HTML and captures</text>
    <text x="422" y="257" class="small">PDFCreator-side capture</text>
    <text x="422" y="278" class="mono">cache/debug-html2pdf/</text>
    <text x="422" y="295" class="mono">PDFCreator/&lt;token&gt;.html</text>
    <text x="422" y="326" class="small">Service-side diagnostic capture</text>
    <text x="422" y="347" class="mono">cache/debug-html2pdf/html2pdf/</text>
    <text x="422" y="364" class="mono">&lt;token&gt;/&lt;token&gt;.html</text>
    <text x="422" y="389" class="small muted">HTML is sent with its export assets</text>
  </g>

  <path d="M725 296 H752" stroke="#147d73" stroke-width="2.5" marker-end="url(#arrow-runtime)"/>

  <g>
    <rect x="762" y="187" width="318" height="220" rx="7" class="runtime-card"/>
    <rect x="762" y="187" width="318" height="8" rx="4" fill="#147d73"/>
    <text x="782" y="226" class="card-title">3. html2pdf service</text>
    <text x="782" y="257" class="small">MainController.renderPDF()</text>
    <text x="782" y="283" class="small">Fast renderer, PDF/UA and</text>
    <text x="782" y="302" class="small">PDF/A-3U remain enabled</text>
    <rect x="782" y="324" width="278" height="58" rx="5" class="soft-runtime"/>
    <text x="796" y="347" class="small" font-weight="700">Patched helper is compiled</text>
    <text x="796" y="367" class="small">into the service application</text>
  </g>

  <path d="M1085 296 H1112" stroke="#147d73" stroke-width="2.5" marker-end="url(#arrow-runtime)"/>

  <g>
    <rect x="1122" y="187" width="288" height="220" rx="7" class="runtime-card"/>
    <rect x="1122" y="187" width="288" height="8" rx="4" fill="#147d73"/>
    <text x="1142" y="226" class="card-title">4. Tagged PDF</text>
    <text x="1142" y="260" class="small">Table structure retained:</text>
    <rect x="1142" y="278" width="246" height="76" rx="5" class="soft-runtime"/>
    <text x="1160" y="303" class="body" font-weight="700">Table</text>
    <text x="1178" y="324" class="body">THead</text>
    <text x="1196" y="345" class="body">TR  /  TH</text>
    <text x="1142" y="382" class="small muted">PDF returned to the caller</text>
  </g>

  <rect x="48" y="472" width="1384" height="316" rx="8" fill="#fbf4eb" stroke="#efdfca"/>
  <text x="70" y="504" class="lane-title" fill="#9c5e1b">MAVEN BUILD: PATCHED DEPENDENCY CLASS</text>

  <g>
    <rect x="68" y="527" width="268" height="208" rx="7" class="build-card"/>
    <rect x="68" y="527" width="268" height="8" rx="4" fill="#b66a1d"/>
    <text x="88" y="566" class="card-title">1. Dependency version</text>
    <text x="88" y="598" class="body">pom.xml</text>
    <text x="88" y="626" class="small">All OpenHTMLtoPDF modules</text>
    <text x="88" y="647" class="small">use the shared version:</text>
    <rect x="88" y="670" width="124" height="36" rx="18" class="soft-build"/>
    <text x="105" y="694" class="body" font-weight="700">1.1.108</text>
  </g>

  <path d="M341 630 H364" stroke="#b66a1d" stroke-width="2.5" marker-end="url(#arrow-build)"/>

  <g>
    <rect x="374" y="527" width="290" height="208" rx="7" class="build-card"/>
    <rect x="374" y="527" width="290" height="8" rx="4" fill="#b66a1d"/>
    <text x="394" y="566" class="card-title">2. Extract source</text>
    <text x="394" y="598" class="small">Dependency plugin takes only</text>
    <text x="394" y="618" class="small">PdfBoxAccessibilityHelper.java</text>
    <text x="394" y="649" class="small">Generated under:</text>
    <text x="394" y="671" class="mono">target/generated-sources/</text>
    <text x="394" y="688" class="mono">openhtmltopdf/...</text>
    <text x="394" y="716" class="small muted">Fresh source each build</text>
  </g>

  <path d="M669 630 H692" stroke="#b66a1d" stroke-width="2.5" marker-end="url(#arrow-build)"/>

  <g>
    <rect x="702" y="527" width="340" height="208" rx="7" class="build-card"/>
    <rect x="702" y="527" width="340" height="8" rx="4" fill="#b66a1d"/>
    <text x="722" y="566" class="card-title">3. Apply guarded patch</text>
    <text x="722" y="598" class="small">Recognize reconstructed header group</text>
    <text x="722" y="620" class="small">and attach its children to this table's</text>
    <text x="722" y="642" class="small">THead structure, updating parent links.</text>
    <text x="722" y="676" class="small">Unexpected children still use warning path.</text>
    <text x="722" y="712" class="small muted">Build fails if patch anchor changes</text>
  </g>

  <path d="M1047 630 H1070" stroke="#b66a1d" stroke-width="2.5" marker-end="url(#arrow-build)"/>

  <g>
    <rect x="1080" y="527" width="330" height="208" rx="7" class="build-card"/>
    <rect x="1080" y="527" width="330" height="8" rx="4" fill="#b66a1d"/>
    <text x="1100" y="566" class="card-title">4. Compile and package</text>
    <text x="1100" y="598" class="small">Build Helper adds generated source;</text>
    <text x="1100" y="620" class="small">javac compiles it with the service.</text>
    <text x="1100" y="652" class="small">Output class:</text>
    <text x="1100" y="674" class="mono">target/classes/com/openhtmltopdf/</text>
    <text x="1100" y="691" class="mono">pdfboxout/...</text>
    <text x="1100" y="719" class="small muted">Packaged app class takes precedence</text>
  </g>

  <path d="M1245 740 V766 H920 V414" fill="none" stroke="#547086" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-link)"/>
  <rect x="48" y="818" width="1384" height="110" rx="8" fill="#fff8e9" stroke="#e8d5a5"/>
  <rect x="68" y="839" width="172" height="30" rx="15" fill="#f2e3bf"/>
  <text x="87" y="860" class="small" font-weight="700" fill="#78551b">SEPARATE INPUT</text>
  <text x="260" y="852" class="body" font-weight="700">The PDFCreator page-break marker is not changed by this patch.</text>
  <text x="260" y="879" class="small">Its CSS rule is separate; removing the explicit marker before the table resolved the blank-page symptom in this export.</text>
  <text x="70" y="956" class="small muted">Generated source and classes live under cache/webservice-html2pdf/target/ and are recreated by Maven; they are not checked-in dependency files.</text>
</svg>
